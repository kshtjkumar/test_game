<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ludus Magnus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --obsidian: #0a0806;
    --stone: #1b1611;
    --stone-light: #241d16;
    --sandstone: #c9a876;
    --gold: #c9a227;
    --gold-bright: #e8c34a;
    --blood: #6b1616;
    --blood-bright: #a12222;
    --ember: #e8834a;
    --parchment: #e8ddc7;
    --parchment-dim: #a89b82;
    --ink: #d8cfbe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--obsidian);
    color: var(--ink);
    font-family: 'EB Garamond', serif;
    min-height: 100vh;
    overflow: hidden;
  }
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    position: relative;
  }

  /* Ambient stone texture backdrop */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 50% 0%, rgba(232,131,74,0.06), transparent 60%),
      radial-gradient(circle at 20% 80%, rgba(107,22,22,0.10), transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(201,162,39,0.06), transparent 45%),
      var(--obsidian);
    z-index: 0;
  }
  /* Vignette that breathes like torchlight */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 5;
    background: radial-gradient(ellipse 70% 65% at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%);
    animation: vignetteBreathe 6s ease-in-out infinite;
  }
  @keyframes vignetteBreathe {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  #main {
    width: 960px;
    max-width: 100%;
    height: 780px;
    background: linear-gradient(180deg, var(--stone-light), var(--stone) 12%, var(--stone) 100%);
    border: 1px solid #3a2f20;
    border-radius: 4px;
    box-shadow:
      0 30px 70px rgba(0,0,0,0.9),
      0 0 0 1px #000,
      inset 0 0 60px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 2;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  #main.phase-fade { opacity: 0; transform: scale(0.97); }

  /* Mosaic border strip — a Roman meander (key) pattern */
  .meander {
    height: 8px;
    width: 100%;
    background-image: repeating-linear-gradient(90deg,
      var(--gold) 0 3px, transparent 3px 6px, transparent 6px 9px, var(--gold) 9px 12px,
      var(--gold) 12px 18px, transparent 18px 21px);
    background-size: 24px 8px;
    opacity: 0.55;
    filter: saturate(0.8);
  }

  /* ===== HEADER — the signature: torch-flanked arch crest ===== */
  #header {
    position: relative;
    background: linear-gradient(180deg, #150f0a, #1b140e);
    padding: 14px 26px 12px;
    border-bottom: 1px solid #3a2f20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    overflow: hidden;
  }
  #header .torch {
    position: relative;
    width: 20px;
    height: 30px;
    flex-shrink: 0;
  }
  #header .torch .flame {
    position: absolute;
    left: 50%;
    bottom: 22px;
    width: 10px;
    height: 16px;
    transform: translateX(-50%);
    background: radial-gradient(circle at 50% 80%, var(--gold-bright), var(--ember) 55%, transparent 80%);
    border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%;
    filter: blur(0.3px);
    animation: flicker 1.6s ease-in-out infinite;
    box-shadow: 0 0 14px 4px rgba(232,131,74,0.55);
  }
  #header .torch .stick {
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 4px;
    height: 22px;
    transform: translateX(-50%);
    background: linear-gradient(180deg, #3a2a18, #1a1006);
    border-radius: 1px;
  }
  @keyframes flicker {
    0%, 100% { transform: translateX(-50%) scaleY(1) scaleX(1) rotate(-1deg); opacity: 0.95; }
    20% { transform: translateX(-52%) scaleY(1.12) scaleX(0.92) rotate(2deg); opacity: 1; }
    40% { transform: translateX(-48%) scaleY(0.9) scaleX(1.05) rotate(-2deg); opacity: 0.9; }
    60% { transform: translateX(-51%) scaleY(1.08) scaleX(0.95) rotate(1deg); opacity: 1; }
    80% { transform: translateX(-49%) scaleY(0.95) scaleX(1) rotate(-1deg); opacity: 0.95; }
  }
  .crest {
    text-align: center;
    flex: 1;
  }
  .crest .eyebrow {
    font-family: 'Cinzel', serif;
    font-size: 0.62em;
    letter-spacing: 5px;
    color: var(--sandstone);
    text-transform: uppercase;
    opacity: 0.8;
  }
  .crest h1 {
    font-family: 'Cinzel Decorative', 'Cinzel', serif;
    font-size: 1.5em;
    letter-spacing: 3px;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(232,195,74,0.35), 0 2px 0 #000;
    margin-top: 2px;
  }
  #round-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72em;
    letter-spacing: 2px;
    color: var(--blood-bright);
    text-transform: uppercase;
    border: 1px solid rgba(161,34,34,0.5);
    padding: 3px 9px;
    border-radius: 2px;
    background: rgba(107,22,22,0.12);
    position: absolute;
    right: 20px;
    top: 14px;
  }
  #denarii-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68em;
    letter-spacing: 1px;
    color: var(--gold-bright);
    text-transform: uppercase;
    position: absolute;
    right: 20px;
    top: 38px;
    opacity: 0.9;
    transition: transform 0.3s ease;
  }
  #denarii-indicator.bump { animation: denariiBump 0.5s ease; }
  @keyframes denariiBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.25); color: var(--gold-bright); }
    100% { transform: scale(1); }
  }
  #phase-label {
    position: absolute;
    left: 46px;
    top: 15px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66em;
    letter-spacing: 1.5px;
    color: var(--parchment-dim);
    text-transform: uppercase;
  }

  /* ===== GAME VIEW ===== */
  #game-view {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 22px;
    overflow: hidden;
    position: relative;
    z-index: 2;
  }
  #narrative {
    flex: 1;
    background: #0d0a07;
    border: 1px solid #332818;
    border-radius: 4px;
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.88em;
    line-height: 1.55;
    overflow-y: auto;
    white-space: pre-wrap;
    margin-bottom: 16px;
    box-shadow: inset 0 0 24px rgba(0,0,0,0.6);
  }
  #narrative::-webkit-scrollbar { width: 8px; }
  #narrative::-webkit-scrollbar-thumb { background: #3a2f20; border-radius: 4px; }
  .log-line { margin-bottom: 10px; opacity: 0; animation: fadeUp 0.45s forwards; color: var(--ink); }
  .log-highlight { color: var(--gold-bright); }
  .log-warn { color: var(--blood-bright); font-weight: bold; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .roster {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
    perspective: 900px;
  }
  .card {
    background: linear-gradient(160deg, #241c13, #17120b);
    border: 1px solid #3a2f20;
    border-radius: 6px;
    padding: 14px 8px 10px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(.22,1,.36,1), box-shadow 0.35s, border-color 0.35s;
    position: relative;
    overflow: hidden;
    font-family: 'JetBrains Mono', monospace;
    transform-style: preserve-3d;
  }
  .card::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(201,162,39,0.06), transparent 40%);
    pointer-events: none;
  }
  .card:hover:not(.disabled) {
    border-color: var(--sandstone);
    transform: translateY(-4px) rotateX(3deg);
    box-shadow: 0 10px 24px rgba(0,0,0,0.6);
  }
  .card.selected {
    border-color: var(--gold);
    background: linear-gradient(160deg, #332707, #201804);
    box-shadow: 0 0 26px rgba(201,162,39,0.4), inset 0 0 18px rgba(201,162,39,0.08);
    animation: selectedPulse 2.4s ease-in-out infinite;
  }
  @keyframes selectedPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(201,162,39,0.3), inset 0 0 18px rgba(201,162,39,0.06); }
    50% { box-shadow: 0 0 34px rgba(201,162,39,0.5), inset 0 0 22px rgba(201,162,39,0.1); }
  }
  .card.wounded { border-color: var(--blood-bright); }
  .card.disabled {
    opacity: 0.3;
    filter: grayscale(1) blur(0.3px);
    cursor: not-allowed;
  }
  .card .portrait {
    font-size: 2.3em;
    margin-bottom: 6px;
    transition: transform 0.3s;
    display: inline-block;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  .card.selected .portrait { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(1) translateY(0); }
    50% { transform: scale(1.07) translateY(-2px); }
  }
  .card:hover:not(.disabled) .portrait { transform: scale(1.14) rotate(-2deg); }
  .card h3 {
    font-family: 'Cinzel', serif;
    font-size: 0.92em;
    letter-spacing: 1px;
    margin-bottom: 4px;
    color: var(--parchment);
  }
  .card .tag { font-size: 0.68em; color: var(--parchment-dim); font-style: italic; line-height: 1.3; font-family: 'EB Garamond', serif; }
  .card .status {
    margin-top: 8px;
    font-size: 0.65em;
    letter-spacing: 0.5px;
    padding: 2px 7px;
    border-radius: 3px;
    display: inline-block;
    text-transform: uppercase;
  }
  .status.healthy { background: rgba(80,140,80,0.12); color: #8fc98f; border: 1px solid rgba(80,140,80,0.3); }
  .status.wounded { background: rgba(161,34,34,0.15); color: #ff9d9d; border: 1px solid rgba(161,34,34,0.4); }
  .status.gone { background: #1a1a1a; color: #666; border: 1px solid #333; }

  .card.wounded::after {
    content: '';
    position: absolute;
    top: 8px; right: 10px;
    width: 6px; height: 10px;
    background: var(--blood-bright);
    border-radius: 50% 50% 40% 40%;
    animation: drip 2.8s ease-in infinite;
    opacity: 0.85;
    box-shadow: 0 0 6px rgba(161,34,34,0.6);
  }
  @keyframes drip {
    0% { transform: translateY(0) scaleY(1); opacity: 0.9; }
    70% { transform: translateY(14px) scaleY(1.4); opacity: 0.6; }
    100% { transform: translateY(22px) scaleY(0.6); opacity: 0; }
  }

  .actions { display: flex; justify-content: center; gap: 14px; }
  .btn {
    padding: 11px 30px;
    background: linear-gradient(180deg, #241c13, #17120b);
    color: var(--parchment);
    border: 1px solid #4a3c22;
    font-family: 'Cinzel', serif;
    letter-spacing: 1.5px;
    font-size: 0.82em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.25s;
    border-radius: 3px;
  }
  .btn:hover:not(:disabled) { background: #33281a; border-color: var(--sandstone); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn.primary {
    background: linear-gradient(180deg, #4a3c10, #2a2007);
    border-color: var(--gold);
    color: var(--gold-bright);
    box-shadow: 0 0 0 rgba(201,162,39,0);
  }
  .btn.primary:hover:not(:disabled) {
    box-shadow: 0 0 18px rgba(201,162,39,0.35);
    background: linear-gradient(180deg, #5a4a14, #332809);
  }

  /* ===== FIGHT OVERLAY ===== */
  #fight-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, #1a0f08 0%, #050302 100%);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    font-family: 'Cinzel', serif;
  }
  #fight-overlay.active { display: flex; }
  .arena-gate {
    font-size: 3.2em;
    margin-bottom: 18px;
    animation: gatePulse 1.2s infinite;
    filter: drop-shadow(0 0 20px rgba(232,131,74,0.4));
  }
  @keyframes gatePulse {
    0%,100% { transform: scale(1); opacity: 0.75; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  #fight-status {
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 0.95em;
    color: var(--sandstone);
  }
  .fight-beat {
    font-family: 'EB Garamond', serif;
    font-style: italic;
    font-size: 1.15em;
    letter-spacing: 0.5px;
    text-transform: none;
    color: var(--gold-bright);
    max-width: 520px;
    line-height: 1.55;
    text-align: center;
    opacity: 0;
    animation: beatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    text-shadow: 0 2px 14px rgba(0,0,0,0.9), 0 0 10px rgba(232,195,74,0.25);
  }
  @keyframes beatIn {
    from { opacity: 0; transform: translateY(10px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .clash {
    font-size: 2.6em;
    animation: clash 0.55s ease-out;
    filter: drop-shadow(0 0 24px rgba(232,195,74,0.6));
  }
  @keyframes clash {
    0% { transform: scale(0.2) rotate(-20deg); opacity: 0; }
    55% { transform: scale(1.4) rotate(10deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .spark {
    position: absolute;
    width: 4px; height: 4px;
    background: var(--gold-bright);
    border-radius: 50%;
    box-shadow: 0 0 8px 2px rgba(232,195,74,0.8);
    animation: sparkFly 0.6s ease-out forwards;
  }
  @keyframes sparkFly {
    to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
  }
  .victory-flash {
    color: var(--gold-bright);
    font-size: 1.5em;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-top: 18px;
    animation: flashIn 0.5s;
    text-shadow: 0 0 20px rgba(232,195,74,0.5);
  }
  @keyframes flashIn { from { opacity: 0; letter-spacing: 12px; } to { opacity: 1; letter-spacing: 3px; } }

  .shake { animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both; }
  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(4px); }
    30%, 50%, 70% { transform: translateX(-6px); }
    40%, 60% { transform: translateX(6px); }
  }

  /* ===== DIALOGUE VIEW ===== */
  #dialogue-view {
    display: none;
    flex: 1;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    z-index: 2;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(107,22,22,0.08), transparent 60%);
  }
  #dialogue-box {
    flex: 1;
    padding: 38px 52px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    overflow-y: auto;
  }
  .char-name {
    color: var(--gold-bright);
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    font-size: 1.1em;
    margin-bottom: 6px;
    font-weight: 700;
    text-transform: uppercase;
  }
  .stage-dir { color: var(--parchment-dim); font-style: italic; margin-bottom: 16px; font-size: 0.95em; }
  .dialogue-text { font-size: 1.22em; line-height: 1.7; min-height: 90px; color: var(--ink); }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.1em;
    background: var(--gold);
    margin-left: 2px;
    animation: blink 0.8s infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }

  #choices {
    padding: 16px 44px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .choice {
    background: linear-gradient(90deg, #1b1611, #211a12);
    border: 1px solid #3a2f20;
    border-left: 4px solid #4a3c22;
    padding: 14px 18px;
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9em;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.25s;
    border-radius: 0 4px 4px 0;
    opacity: 0;
    animation: choiceIn 0.4s ease forwards;
  }
  @keyframes choiceIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
  .choice:hover {
    background: linear-gradient(90deg, #241c13, #2a2115);
    border-left-color: var(--gold);
    transform: translateX(5px);
    box-shadow: -2px 4px 14px rgba(0,0,0,0.4);
  }
  .choice .tag { color: var(--parchment-dim); margin-right: 10px; font-size: 0.85em; }
  .force-tag { color: var(--blood-bright) !important; }
  .relinquish-tag { color: #8fc98f !important; }

  .outcome-block { font-family: 'JetBrains Mono', monospace; line-height: 1.7; }
  .outcome-block p { margin-bottom: 6px; }
  .system-msg { color: var(--blood-bright); font-weight: bold; margin: 10px 0; }
  .narrator { color: var(--parchment-dim); font-style: italic; font-family: 'EB Garamond', serif; font-size: 1.05em; }
  .analysis { margin-top: 22px; padding-top: 16px; border-top: 1px dashed #3a2f20; color: #8fc98f; }
  .analysis.fail { color: var(--blood-bright); }

  .legacy-token {
    display: inline-block;
    margin: 14px 0;
    padding: 10px 22px;
    background: linear-gradient(135deg, #3a2e0a, #5a4a1a);
    border: 1px solid var(--gold);
    border-radius: 4px;
    color: var(--gold-bright);
    font-weight: bold;
    font-family: 'Cinzel', serif;
    letter-spacing: 1.5px;
    animation: tokenPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 0 24px rgba(201,162,39,0.35);
  }
  @keyframes tokenPop {
    0% { transform: scale(0.3); opacity: 0; }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  /* ===== SURVEY ===== */
  #survey-view {
    display: none;
    flex: 1;
    flex-direction: column;
    padding: 30px 42px;
    overflow-y: auto;
    position: relative;
    z-index: 2;
  }
  .survey-title {
    font-family: 'Cinzel', serif;
    letter-spacing: 1.5px;
    color: var(--gold-bright);
    border-bottom: 1px solid #3a2f20;
    padding-bottom: 12px;
    margin-bottom: 12px;
  }
  .survey-instr { color: var(--parchment-dim); font-style: italic; margin-bottom: 24px; font-size: 0.94em; }
  .dim-title {
    color: #8fb7c9;
    font-family: 'Cinzel', serif;
    letter-spacing: 1px;
    margin: 26px 0 4px;
    font-size: 0.98em;
  }
  .dim-desc { font-size: 0.82em; color: var(--parchment-dim); font-style: italic; margin-bottom: 12px; }
  .q-block {
    background: #15110b;
    border-left: 3px solid #3a2f20;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-radius: 0 4px 4px 0;
    transition: border-color 0.2s;
  }
  .q-block:focus-within { border-left-color: var(--gold); }
  .q-text { margin-bottom: 12px; font-size: 0.95em; }
  .likert {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78em;
    color: var(--parchment-dim);
  }
  .likert-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .likert-opt input { cursor: pointer; accent-color: var(--gold); }
  .submit-btn {
    width: 100%;
    margin: 28px 0 20px;
    padding: 14px;
    background: linear-gradient(180deg, var(--gold-bright), var(--gold));
    color: #17120b;
    border: none;
    font-family: 'Cinzel', serif;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 1em;
    font-weight: 700;
    cursor: pointer;
    border-radius: 3px;
    transition: box-shadow 0.2s;
  }
  .submit-btn:hover { box-shadow: 0 0 24px rgba(201,162,39,0.5); }
  #results {
    display: none;
    background: #0d0a07;
    border: 1px solid var(--gold);
    padding: 20px;
    font-family: 'JetBrains Mono', monospace;
    margin-bottom: 24px;
    border-radius: 4px;
  }

  .fade-in { animation: fadeIn 0.7s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== CAMPFIRE MOMENTS ===== */
  .campfire-line {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 4px 0 14px;
    padding: 10px 14px;
    border-radius: 4px;

<script>
/* ================= PARTICLES (drifting arena dust + embers) ================= */
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
const PARTICLE_COUNT = 60;

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function createParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const ember = Math.random() < 0.15;
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: ember ? Math.random() * 1.6 + 0.6 : Math.random() * 1.4 + 0.3,
      speedX: (Math.random() - 0.5) * 0.3,
      speedY: ember ? -(Math.random() * 0.4 + 0.15) : (Math.random() * 0.2 + 0.04),
      opacity: Math.random() * 0.35 + 0.08,
      ember
    });
  }
}
createParticles();

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life === undefined || p.life > 0);
  particles.forEach(p => {
    p.x += p.speedX;
    p.y += p.speedY;
    if (p.life !== undefined) { p.life--; p.opacity *= 0.94; }
    if (p.ember && p.y < -5) { p.y = canvas.height + 5; p.x = Math.random() * canvas.width; }
    if (!p.ember && p.life === undefined) {
      if (p.y > canvas.height) { p.y = -5; p.x = Math.random() * canvas.width; }
      if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
    }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = p.customColor
      ? `rgba(${p.customColor}, ${p.opacity})`
      : (p.ember ? `rgba(232, 131, 74, ${p.opacity})` : `rgba(190, 168, 130, ${p.opacity})`);
    ctx.fill();
  });
  requestAnimationFrame(animateParticles);
}
animateParticles();

function burst(x, y, count = 28, color = '212,195,74') {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3.5 + 1.5;
    particles.push({
      x, y,
      size: Math.random() * 2.2 + 0.8,
      speedX: Math.cos(angle) * speed,
      speedY: Math.sin(angle) * speed,
      opacity: 0.9,
      life: 40 + Math.random() * 30,
      ember: false,
      customColor: color
    });
  }
}

/* Spark flecks inside the fight overlay on clash */
function spawnSparks(container) {
  for (let i = 0; i < 14; i++) {

    const dist = 40 + Math.random() * 60;
    s.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
    s.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
    s.style.left = '50%';
    s.style.top = '46%';
    container.appendChild(s);
    setTimeout(() => s.remove(), 650);
  }
}

const eventLog = [];

function logEvent({ roundNumber, eventType, fighter, choiceMade, latencyMs, extraCols = {} }) {
  const f = fighter || selected || {};
  const lat = (latencyMs !== undefined && latencyMs !== '' && latencyMs !== null) ? Number(latencyMs) : null;
  const isValidRt = lat !== null ? (lat >= 150 && lat <= 30000) : true;
  eventLog.push({
    Subject_ID: sessionId,
    Arm: behavioralData.arm || 'Unassigned',
    Round_Number: roundNumber,
    Event_Type: eventType,
    Fighter_Name: f.name || '',
    Motive_Tag: f.motive || '',
    Choice_Made: choiceMade,
    Latency_ms: latencyMs !== undefined ? latencyMs : '',
    Is_Valid_RT: isValidRt,
    Association_Streak: consecutive,
    Wounded_State: f.state === 'wounded',
    Cumulative_Score: denarii,
    Timestamp: new Date().toISOString(),
    ...extraCols
  });
}

/* A richer, animated beat for campfire flavor text — flickering icon,

function logCampfire(text, { warn = false, icon = null } = {}) {
  const wrap = document.createElement('div');
  wrap.className = 'campfire-line' + (warn ? ' warn' : '');
  const iconEl = document.createElement('div');
  iconEl.className = 'campfire-icon';
  iconEl.textContent = icon || (warn ? '⚠️' : '🔥');
  const textEl = document.createElement('div');
  textEl.className = 'campfire-text';
  wrap.append(iconEl, textEl);
  narrativeEl.appendChild(wrap);
  narrativeEl.scrollTop = narrativeEl.scrollHeight;

  // small warm ember puff near the narrative panel for extra feel
  const rect = narrativeEl.getBoundingClientRect();
  burst(rect.left + 30, rect.top + rect.height - 20, 10, warn ? '161,34,34' : '232,131,74');

  let i = 0;
  const cursor = document.createElement('span');
  cursor.className = 'cf-cursor';
  textEl.appendChild(cursor);
  return new Promise(resolve => {
    function tick() {
      if (i < text.length) {
        textEl.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        narrativeEl.scrollTop = narrativeEl.scrollHeight;
        setTimeout(tick, 16);
      } else {
        cursor.remove();
        resolve();
      }
    }
    tick();
  });
}

/* ================= RENDER & PARADIGM CONTROL ================= */
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let currentRosterDisplay = null;

async function showFixationCross(durationMs = 500) {
  const iti = document.getElementById('iti-overlay');
  if (!iti) return;
  iti.style.display = 'flex';
  await wait(durationMs);
  iti.style.display = 'none';
}

    card.className = `card ${!g.active ? 'disabled' : ''} ${selected?.id === g.id ? 'selected' : ''} ${g.state === 'wounded' ? 'wounded' : ''}`;
    let statusClass = g.state === 'wounded' ? 'wounded' : 'healthy';
    let statusText = g.state === 'wounded' ? 'Bandaged' : 'Healthy';
    if (!g.active) { statusClass = 'gone'; statusText = 'Gone'; }
    card.innerHTML = `
      <div class="portrait">${g.emoji}</div>
      <h3>${g.name}</h3>
      <div class="tag">"${g.tag}"</div>
      <div class="status ${statusClass}">${statusText}</div>

    if (g.active && phase === 'selection') {
      card.onclick = () => {
        selected = g;
        renderRoster(false);
        postLossMode ? renderPostLossActions() : renderActions();
      };
    }
    rosterEl.appendChild(card);
  });
}

function renderActions() {
  actionsEl.innerHTML = '';
  if (phase === 'selection') {
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = 'Enter the Arena';
    btn.disabled = !selected;
    btn.onclick = executeFight;
    actionsEl.appendChild(btn);
  }
}

/* ================= FIGHT ================= */
function wait(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

const fightBeatPool = [
  (name) => `${name} tests the enemy's guard, feeling out an opening.`,
  (name) => `Steel rings across the sand as ${name} parries a vicious strike.`,
  (name) => `The crowd roars as ${name} presses the advantage.`,
  (name) => `${name} takes a glancing blow — but holds firm.`,
  (name) => `A feint, a lunge — ${name} reads it perfectly.`,
  (name) => `Dust kicks up in a blur of steel and sand.`,
  (name) => `${name}'s opponent stumbles, off balance for half a heartbeat.`,
  (name) => `The two circle each other, breath ragged, neither giving ground.`,
  (name) => `${name} grits their teeth and pushes through the pain.`
];

function pickFightBeats(name, count) {
  const pool = [...fightBeatPool];
  const chosen = [];
  for (let i = 0; i < count && pool.length; i++) {
    const idx = Math.floor(Math.random() * pool.length);
    chosen.push(pool.splice(idx, 1)[0](name));
  }
  return chosen;
}

async function executeFight() {
  if (!selected) return;
  const fighter = selected;
  phase = 'fight';
  renderRoster();
  renderActions();

  if (roundSelectionStartTime !== null) {
    roundLatencyByRound[currentRound] = Math.round(performance.now() - roundSelectionStartTime);
  }
  if (currentRound === 1) {
    behavioralData.engagementFirstMs = roundLatencyByRound[1] ?? null;
  }
  if (fighter.state === 'wounded') {
    woundedRoundsForced++;
  }

  if (previous && previous.id === fighter.id) consecutive++;
  else consecutive = 1;
  
  const choiceMade = currentRound === 1 ? 'Initial_Pick' : (previous && previous.id === fighter.id ? 'Stick' : 'Switch');
  logEvent({
    roundNumber: currentRound,
    eventType: 'Selection',
    fighter,
    choiceMade,
    latencyMs: roundLatencyByRound[currentRound]
  });

  previous = fighter;

  fightOverlay.classList.add('active');
  fightOverlay.querySelector('.arena-gate').textContent = '⚔️';
  fightStatus.className = '';
  fightStatus.textContent = `${fighter.name} enters the arena…`;
  fightStatus.style.display = 'block';
  fightResult.style.display = 'none';

  await wait(1100);

  const beatCount = 2 + Math.floor(Math.random() * 2); // 2 or 3 exchanges
  const beats = pickFightBeats(fighter.name, beatCount);
  const clashIcons = ['⚔️', '🗡️', '🛡️'];

  for (let i = 0; i < beats.length; i++) {
    fightStatus.style.display = 'none';
    const clashEl = document.createElement('div');
    clashEl.className = 'clash';
    clashEl.textContent = clashIcons[i % clashIcons.length];
    fightOverlay.insertBefore(clashEl, fightResult);
    spawnSparks(fightOverlay);

    mainEl.classList.add('shake');
    setTimeout(() => mainEl.classList.remove('shake'), 500);
    await wait(600);
    clashEl.remove();

    fightStatus.className = 'fight-beat';
    fightStatus.textContent = beats[i];
    fightStatus.style.display = 'block';
    await wait(2400); // 2.4s per exchange beat for comfortable reading
  }

  fightStatus.style.display = 'none';
  fightResult.style.display = 'block';
  fightResult.textContent = `${fighter.name} is victorious!`;
  const rect = mainEl.getBoundingClientRect();
  burst(rect.left + rect.width / 2, rect.top + rect.height / 2, 34);

  await wait(2500); // 2.5s victory celebration display
  fightOverlay.classList.remove('active');
  afterFight();
}

function getParadigmParams() {
  const params = new URLSearchParams(window.location.search);
  const targetStreak = parseInt(params.get('streak') || '5', 10);
  const targetMinRounds = parseInt(params.get('minRounds') || '5', 10);
  return { targetStreak, targetMinRounds };
}

function afterFight() {
  log(`— Round ${currentRound} —`);
  log(`You send ${selected.name} into the arena. The gates open…`);
  log(`${selected.name} strikes a fatal blow and emerges victorious! The crowd roars.`, 'highlight');

  const { targetStreak, targetMinRounds } = getParadigmParams();
  if (consecutive >= targetStreak && currentRound >= targetMinRounds) {
    behavioralData.associationLevel = consecutive;
    behavioralData.arm = randomArm();
    setTimeout(() => {
      log(`The crowd's roar shifts. Somewhere above the sand, someone has started paying closer attention to your fighter.`, 'warn');
      setTimeout(() => {
        if (behavioralData.arm === 'A') phaseTransition(runArmA);
        else if (behavioralData.arm === 'B') phaseTransition(runArmB);
        else phaseTransition(startDialogue);
      }, 1600);
    }, 500);
    return;
  }

  setTimeout(async () => {
    if (currentRound === 3) {
      const t0 = performance.now();
      await logCampfire(`${selected.name} cleans their blade by the fire. "I only need a few more victories," they whisper. "${selected.tag}"`);
      empathyDwellMs += performance.now() - t0;
    }
    if (currentRound === 4) {
      const t0 = performance.now();
      await logCampfire(`${selected.name} is breathing heavily, staring into the flames. The last fight took a toll.`);
      await logCampfire(`In the arena, no one is immortal. Every wound leaves a mark. ${selected.name} is human, and humans break.`, { warn: true, icon: '⚠️' });
      empathyDwellMs += performance.now() - t0;
      selected.state = 'wounded';
    }
    currentRound++;
    phase = 'selection';
    roundInd.textContent = `Round ${currentRound}`;
    log(`Will you stick with ${selected.name} or choose a new fighter for Round ${currentRound}?`);
    
    // 500ms Standardized Fixation Cross ITI & Fisher-Yates Roster Reshuffle
    await showFixationCross(500);
    roundSelectionStartTime = performance.now();
    renderRoster(true);
    renderActions();
  }, 400);
}

/* ================= POST-LOSS RESELECTION ================= */
/* Common to all three arms: after the loss/relinquishment event, the
   player picks one more fighter. This is what makes Legacy Choice
   (Identity Carryover) and Engagement Delta measurable — both require
   comparing a second selection against the first. */
function renderPostLossActions() {
  actionsEl.innerHTML = '';
  const btn = document.createElement('button');
  btn.className = 'btn primary';
  btn.textContent = 'Confirm Choice';
  btn.disabled = !selected;
  btn.onclick = finalizePostLossSelection;
  actionsEl.appendChild(btn);
}

function postLossSelection() {
  lostFighter = selected;
  selected = null;
  phase = 'selection';
  postLossMode = true;

  document.getElementById('dialogue-view').style.display = 'none';
  fightOverlay.classList.remove('active', 'defeat');
  document.getElementById('game-view').style.display = 'flex';
  phaseLabel.textContent = 'Choose Again';

  log(`The dust settles. ${lostFighter.name}'s place at your side is gone. Who will you turn to now?`, 'highlight');
  postLossSelectionStartTime = performance.now();
  renderRoster();
  renderPostLossActions();
}

function finalizePostLossSelection() {
  if (!selected) return;
  behavioralData.engagementPostLossMs = Math.round(performance.now() - postLossSelectionStartTime);
  behavioralData.engagementDeltaMs = (behavioralData.engagementFirstMs !== null)
    ? behavioralData.engagementPostLossMs - behavioralData.engagementFirstMs
    : null;
  behavioralData.legacyChoiceSimilar = lostFighter ? (selected.motive === lostFighter.motive) : null;

  logEvent({
    roundNumber: '7_Reselection',
    eventType: 'Reselection',
    fighter: selected,
    choiceMade: 'Reselect',
    latencyMs: behavioralData.engagementPostLossMs
  });

  phaseTransition(startSurvey);
}

/* ================= ARM A: PASSIVE FADING (Control) ================= */
function runArmA() {
  phaseLabel.textContent = 'The Aftermath';
  fightOverlay.classList.add('active', 'defeat');
  fightOverlay.innerHTML = `
    <div class="defeat-icon">🗡️</div>
    <div id="fight-status" style="color:var(--parchment-dim)">${selected.name} falters in the sand…</div>
  `;
  setTimeout(() => {
    const flash = document.createElement('div');
    flash.className = 'defeat-flash';
    flash.textContent = 'Defeated';
    fightOverlay.appendChild(flash);
    mainEl.classList.add('shake');
    setTimeout(() => mainEl.classList.remove('shake'), 500);
  }, 1200);
  setTimeout(() => {
    const prompt = document.createElement('div');
    prompt.className = 'overlay-prompt';
    prompt.innerHTML = `Your fighter falls. No warning, no story — just a blade in the wrong place, at the wrong time.<br>Choose again.`;
    fightOverlay.appendChild(prompt);
    decisionStartTime = performance.now();
    const choices = document.createElement('div');
    choices.className = 'overlay-choices';
    const btn = document.createElement('button');
    btn.className = 'btn primary';
    btn.textContent = 'Choose Your Next Fighter';
    btn.onclick = () => {
      behavioralData.relinquishmentLatencyMs = Math.round(performance.now() - decisionStartTime);
      behavioralData.finalChoice = 'PassiveContinue';
      logEvent({
        roundNumber: '6_Manipulation',
        eventType: 'Passive_Loss',
        fighter: selected,
        choiceMade: 'PassiveContinue',
        latencyMs: behavioralData.relinquishmentLatencyMs
      });
      selected.active = false;
      fightOverlay.classList.remove('active', 'defeat');
      phaseTransition(postLossSelection);
    };
    choices.appendChild(btn);
    fightOverlay.appendChild(choices);
  }, 2200);
}

/* ================= ARM B: FORCED SEVERING (Mechanical Loss) ================= */
function runArmB() {
  phaseLabel.textContent = "The Magistrate's Ledger";
  fightOverlay.classList.add('active', 'defeat');
  fightOverlay.innerHTML = `
    <div class="defeat-icon">💀</div>
    <div id="fight-status" style="color:var(--parchment-dim)">${selected.name} falls…</div>
  `;
  setTimeout(() => {
    const flash = document.createElement('div');
    flash.className = 'defeat-flash';
    flash.textContent = `Game Over for ${selected.name}`;
    fightOverlay.appendChild(flash);
    mainEl.classList.add('shake');
    setTimeout(() => mainEl.classList.remove('shake'), 500);
  }, 1200);
  setTimeout(() => {
    const prompt = document.createElement('div');
    prompt.className = 'overlay-prompt';
    prompt.innerHTML = `[SYSTEM]: Character Permanently Deleted.<br>Return to the main menu to restart — or accept the loss and continue.`;
    fightOverlay.appendChild(prompt);
    decisionStartTime = performance.now();
    const choices = document.createElement('div');
    choices.className = 'overlay-choices';

    const restartBtn = document.createElement('button');
    restartBtn.className = 'btn';
    restartBtn.textContent = 'Attempt Restart';
    restartBtn.onclick = () => {
      behavioralData.relinquishmentLatencyMs = Math.round(performance.now() - decisionStartTime);
      behavioralData.finalChoice = 'AttemptedRestart';
      behavioralData.resistanceAttempted = true;
      logEvent({
        roundNumber: '6_Manipulation',
        eventType: 'System_Loss',
        fighter: selected,
        choiceMade: 'AttemptedRestart',
        latencyMs: behavioralData.relinquishmentLatencyMs
      });
      restartBtn.disabled = true;
      acceptBtn.disabled = true;
      const note = document.createElement('div');
      note.className = 'overlay-prompt';
      note.style.color = 'var(--blood-bright)';
      note.textContent = 'There is no restart. The roster does not forget.';
      fightOverlay.appendChild(note);
      setTimeout(() => {
        selected.active = false;
        fightOverlay.classList.remove('active', 'defeat');
        phaseTransition(postLossSelection);
      }, 1800);
    };

    const acceptBtn = document.createElement('button');
    acceptBtn.className = 'btn primary';
    acceptBtn.textContent = 'Accept & Continue';
    acceptBtn.onclick = () => {
      behavioralData.relinquishmentLatencyMs = Math.round(performance.now() - decisionStartTime);
      behavioralData.finalChoice = 'AcceptedLoss';
      behavioralData.resistanceAttempted = false;
      logEvent({
        roundNumber: '6_Manipulation',
        eventType: 'System_Loss',
        fighter: selected,
        choiceMade: 'AcceptedLoss',
        latencyMs: behavioralData.relinquishmentLatencyMs
      });
      selected.active = false;
      fightOverlay.classList.remove('active', 'defeat');
      phaseTransition(postLossSelection);
    };

    choices.append(restartBtn, acceptBtn);
    fightOverlay.appendChild(choices);
  }, 2200);
}

/* ================= DIALOGUE (Arm C) ================= */
function startDialogue() {
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('dialogue-view').style.display = 'flex';
  phaseLabel.textContent = 'The Infirmary';
  phase = 'dialogue';
  renderNode('start');
}

function typeText(el, text, speed = 20) {
  return new Promise(resolve => {
    el.innerHTML = '';
    let i = 0;
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    el.appendChild(cursor);
    function tick() {
      if (i < text.length) {
        el.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        setTimeout(tick, speed);
      } else { cursor.remove(); resolve(); }
    }
    tick();
  });
}

async function renderNode(id) {
  const node = storyNodes[id];
  const box = document.getElementById('dialogue-box');
  const choices = document.getElementById('choices');
  box.innerHTML = '';
  choices.innerHTML = '';

  const name = selected ? selected.name : "Gladiator";

  if (node.isOutcome) {
    box.innerHTML = node.html.replace(/\[G\]/g, name);
    const rect = mainEl.getBoundingClientRect();
    if (node.flash === 'gold') burst(rect.left + rect.width/2, rect.top + rect.height/2, 40, '232,195,74');
    if (node.flash === 'blood') {
      mainEl.classList.add('shake');
      setTimeout(() => mainEl.classList.remove('shake'), 500);
    }
    // Either outcome removes the fighter from the active roster —
    // Force Fight (death) and Relinquish (retired) both end their run.
    if (selected) selected.active = false;
    if (id === 'outcomeA') {
      awardDenarii(500);
      burst(rect.left + rect.width/2, rect.top + rect.height/2, 26, '232,195,74');
    }
  } else {
    const nameEl = document.createElement('div');
    nameEl.className = 'char-name';
    nameEl.textContent = name;
    const dirEl = document.createElement('div');
    dirEl.className = 'stage-dir';
    dirEl.textContent = node.direction;
    const textEl = document.createElement('div');
    textEl.className = 'dialogue-text';
    box.append(nameEl, dirEl, textEl);
    await typeText(textEl, node.text);
  }

  // Reset decision timer until choices finish fade-in
  if (id === 'confrontation' || id === 'plea') {
    decisionStartTime = null;
  }

  node.choices.forEach((c, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice fade-in';
    btn.style.animationDelay = `${idx * 0.12}s`;
    btn.innerHTML = (c.tag ? `<span class="tag ${c.tagClass || ''}">${c.tag}</span>` : '') + c.text;
    if (c.action === 'startSurvey') {
      btn.onclick = () => phaseTransition(postLossSelection);
    } else {
      btn.onclick = () => {
        if ((id === 'confrontation' || id === 'plea') && decisionStartTime) {
          behavioralData.relinquishmentLatencyMs = Math.round(performance.now() - decisionStartTime);
          behavioralData.finalChoice = c.next === 'outcomeA' ? 'ForceFight' : 'Relinquish';
          logEvent({
            roundNumber: '6_Manipulation',
            eventType: 'Plea',
            fighter: selected,
            choiceMade: behavioralData.finalChoice,
            latencyMs: behavioralData.relinquishmentLatencyMs
          });
        }
        renderNode(c.next);
      };
    }
    choices.appendChild(btn);
  });

  // Start post-reading decision latency clock ONLY after choice buttons complete entrance animation!
  setTimeout(() => {
    if (id === 'confrontation' || id === 'plea') {
      decisionStartTime = performance.now();
    }
  }, node.choices.length * 120 + 350);
}

/* ================= SURVEY ================= */
function buildSurvey() {
  const container = document.getElementById('survey-questions');
  let html = '';
  surveyData.forEach((dim, di) => {
    html += `<h3 class="dim-title">${dim.section}</h3>`;
    dim.questions.forEach((q, qi) => {
      const num = di * 5 + qi + 1;
      let opts = '';
      for (let i = 1; i <= 7; i++) {
        opts += `<label class="likert-opt"><input type="radio" name="q${num}" value="${i}" required>${i}</label>`;
      }
      html += `
        <div class="q-block">
          <div class="q-text">${q}</div>
          <div class="likert"><span>Strongly Disagree</span>${opts}<span>Strongly Agree</span></div>
        </div>`;
    });
  });
  container.innerHTML = html;
  document.getElementById('ears-form').addEventListener('submit', e => {
    e.preventDefault();
    calcResults();
  });
}

/* ================= DERIVED METRICS & CSV EXPORT ================= */
function mean(arr) { return arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null; }
function stdDev(arr) {
  if (arr.length < 2) return null;
  const m = mean(arr);
  const variance = arr.reduce((a,b) => a + (b-m)**2, 0) / (arr.length - 1);
  return Math.sqrt(variance);
}

function computeDerivedMetrics() {
  // Baseline per cognitive spec: mean/SD of selection latency across all pre-trigger rounds.
  const baselineLatencies = Object.keys(roundLatencyByRound)
    .map(Number)
    .filter(r => r < currentRound)
    .map(r => roundLatencyByRound[r])
    .filter(v => v !== undefined);
  const baselineMean = mean(baselineLatencies);
  const baselineSd = stdDev(baselineLatencies);

  // Existential Weight: (L_relinquish - baseline mean) / baseline SD.
  let ew = null;
  if (behavioralData.relinquishmentLatencyMs !== null && baselineMean !== null && baselineSd) {
    ew = (behavioralData.relinquishmentLatencyMs - baselineMean) / baselineSd;
  }
  const ewInterpretation = ew === null ? null : (ew > 2.0 ? 'High Existential Achievement' : ew < 0.5 ? 'Automatic Processing' : 'Moderate');

  // X1: Association Strength — mean selection speed across habituation rounds (Rounds 2 to N-1).
  const preRounds = Object.keys(roundLatencyByRound).map(Number).filter(r => r >= 2 && r < currentRound);
  const x1AssociationStrengthMs = mean(preRounds.map(r => roundLatencyByRound[r]).filter(v => v !== undefined));
  // X2: Narrative Engagement — total dwell time on campfire/backstory beats.
  const x2NarrativeEngagementMs = Math.round(empathyDwellMs);
  // X3: Visual Decay Reaction — change in selection latency right after the
  // wounded/system warning appears.
  const prevRound = currentRound - 1;
  const x3VisualDecayReactionMs = (roundLatencyByRound[currentRound] !== undefined && roundLatencyByRound[prevRound] !== undefined)
    ? roundLatencyByRound[currentRound] - roundLatencyByRound[prevRound]
    : null;

  return {
    baselineMean, baselineSd, ew, ewInterpretation,
    x1AssociationStrengthMs, x2NarrativeEngagementMs, x3VisualDecayReactionMs
  };
}

function toCsvValue(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function downloadSessionCsv(rows) {
  const dataset = Array.isArray(rows) ? rows : [rows];
  if (!dataset.length) return;

  const headersSet = new Set();
  dataset.forEach(r => Object.keys(r).forEach(k => headersSet.add(k)));
  const headers = Array.from(headersSet);

  const csv = headers.join(',') + '\n' + dataset.map(r => headers.map(h => toCsvValue(r[h])).join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gladiator_study_events_${sessionId}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function startSurvey() {
  document.getElementById('game-view').style.display = 'none';
  document.getElementById('dialogue-view').style.display = 'none';
  fightOverlay.classList.remove('active', 'defeat');
  document.getElementById('survey-view').style.display = 'flex';
  phaseLabel.textContent = 'Reflection';
  phase = 'survey';
}

function calcResults() {
  const fd = new FormData(document.getElementById('ears-form'));
  const scores = [0,0,0,0];
  const itemResponses = {};
  for (let i = 1; i <= 20; i++) {
    const v = parseInt(fd.get(`q${i}`));
    itemResponses[`q${i}_score`] = isNaN(v) ? '' : v;
    if (!isNaN(v)) scores[Math.floor((i-1)/5)] += v;
  }
  const avgs = scores.map(s => (s/5).toFixed(2));
  const derived = computeDerivedMetrics();

  // Log final survey event row (Row 8) with item-level q1..q20 ratings & subscales
  logEvent({
    roundNumber: '8_Survey',
    eventType: 'EARS_Survey',
    choiceMade: 'Survey_Submit',
    latencyMs: sessionStartTime !== null ? Math.round(performance.now() - sessionStartTime) : 0,
    extraCols: {
      ...itemResponses,
      ears_relinquishment_score: avgs[0],
      ears_meaning_reconstruction_score: avgs[1],
      ears_finitude_awareness_score: avgs[2],
      ears_bond_transformation_score: avgs[3]
    }
  });

  // Backfill assigned experimental Arm across all early selection rows
  eventLog.forEach(r => {
    if (r.Arm === 'Unassigned' || !r.Arm) r.Arm = behavioralData.arm || 'Unassigned';
  });

  console.log('[STUDY EVENT DATA (LONG FORMAT WITH Q1-Q20)]', eventLog);
  downloadSessionCsv(eventLog);

  const res = document.getElementById('results');
  res.innerHTML = `
    <p style="text-align:center; font-size:1.1em; line-height:1.6;">Thank you for taking part.</p>
    <p style="text-align:center; color:var(--parchment-dim); font-style:italic; margin-top:10px;">Your responses have been recorded. You may now close this window.</p>`;
  res.style.display = 'block';
  document.querySelector('.submit-btn').style.display = 'none';
  res.scrollIntoView({ behavior: 'smooth' });
}

/* ================= INIT ================= */
function init() {
  log('Welcome to the Ludus. Select your fighter for Round 1.', 'highlight');
  sessionStartTime = performance.now();
  roundSelectionStartTime = performance.now();
  renderRoster();
  renderActions();
  buildSurvey();
}
init();
